<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="..\assets\css\page5.css">
</head>

<body>


<header class="navbar">
  <div class="nav-container">
    <div class="logo">Mix Shades</div>

    <button class="menu-toggle" id="menuToggle">☰</button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="color-pencils.html">Color Pencils</a>
      <a href="..\pages\page3.html">Watercolor</a>

    <button class="dark-toggle" id="darkToggle">🌆🌃</button>
  </div>
</header>


<section class="contact-hero">
  <h1>Contact Us</h1>
  <p>Have questions about mixing colors? Send us a message!</p>
</section>

<section class="contact-section">
  <form class="contact-form">

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

    <button type="submit" class="submit-btn">Send Message</button>

  </form>
</section>




<script src="..\assets\js\page5.js"></script>
<script src="..\assets\js\footer.js"></script>
</body>
</html>
